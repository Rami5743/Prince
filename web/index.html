<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:,">
<title>Prince of Persia, Reconstructed</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* The window is the game. Two thin margins hold the title on one side
     and the two panels on the other, and nothing scrolls: the whole
     height of the window belongs to the picture.

     Everything is laid out in logical directions -- inline-start, not
     left -- so that `dir="rtl"` moves the title to the right-hand margin
     and the panels to the left without a second stylesheet. */
  :root {
    --ink: #0d0b14;
    --vault: #15121f;
    --brass: #d9a441;
    --ember: #c0392b;
    --sand: #e8dcc0;
    --dim: #8b7f6a;
    --rule: #2a2436;
    color-scheme: dark;
    --display: 'Amiri', 'Iowan Old Style', Georgia, serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    /* Two widths, not one. The title margin holds a title and nothing
       else, so it is given the width a title needs; the panels margin
       holds four menus and three pairs of buttons and needs more. Every
       pixel the title margin gives up goes to the picture, which is
       what clause 2 asks for: measured at 1280 by 860, the game went
       from 907x680 to 959x719 by this line alone. */
    --title-w: clamp(104px, 9.5vw, 150px);
    --panel-w: clamp(140px, 13.5vw, 196px);
    --gap: 10px;
    /* The shape of a pixel, which the Pixels setting moves. */
    --ar: 4 / 3;
    --ar-num: 1.3333;
  }
  html[lang="he"] {
    --display: 'Heebo', 'Arial Hebrew', system-ui, sans-serif;
    --mono: 'Heebo', ui-monospace, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }

  /* No scrolling, anywhere, ever. */
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: var(--ink);
    color: var(--sand);
    font-family: var(--mono);
    font-size: 13px;
    display: grid;
    grid-template-columns: var(--title-w) minmax(0, 1fr) var(--panel-w);
    /* The line that says what the page is doing has a row of its own.
       It used to be `position: absolute; bottom: 2px` inside the
       stage, which is right only while the stage is taller than the
       picture: in the stacked layout at 780 by 620 it was drawn over
       the strip under the room, so `מושהה — הקישו מקש כלשהו` sat on
       top of `המשחק מושהה`. A row cannot overlap anything, and the
       stage's own box -- which is what the canvas is measured
       against -- is the smaller for it. */
    grid-template-rows: minmax(0, 1fr) auto;
    grid-template-areas:
      "title stage  panels"
      "title status panels";
    gap: var(--gap);
    padding: var(--gap);
    padding-left: max(var(--gap), env(safe-area-inset-left, 0px));
    padding-right: max(var(--gap), env(safe-area-inset-right, 0px));
    padding-bottom: max(var(--gap), env(safe-area-inset-bottom, 0px));
  }

  /* ----------------------------------------------------- the margins */

  #margin-title { grid-area: title; }
  #margin-panels { grid-area: panels; }
  #stage { grid-area: stage; }

  .margin {
    min-width: 0;
    min-height: 0;
    overflow: hidden auto;
    scrollbar-width: thin;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Clause 2: "drop all the current prose". What is left in this
     margin is the name of the game. */
  #margin-title h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(19px, 2.1vw, 27px);
    line-height: 1.15;
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--brass);
    text-wrap: balance;
  }
  /* The keys.
     They were two columns in the title margin and **the second column
     was clipped**: `grid-template-columns: auto 1fr` gives the first
     column the widest key name there is, and at 1280 by 860 that left
     the description 51 pixels, so `move; a corner jumps that way` came
     out reading `move; a corner jumps t way` with the rest cut off by
     the margin's own `overflow: hidden`. Measured: the list wanted 186
     pixels in a 166-pixel margin, and 186 in a 133-pixel one at 1024.

     So the list is a panel of its own, where there is room for it, and
     both columns may shrink and wrap -- `minmax(0, ...)` is what lets
     a grid column go under its own content's width, and without it no
     amount of margin fixes this. */
  #keys {
    margin: 0;
    font-size: 11px;
    line-height: 1.35;
  }
  /* The key on its own line and what it does under it, rather than the
     two side by side. A margin is 140 to 196 pixels wide and a key name
     is a third of that, so side by side left the description a word at
     a time; given the whole width, most of them are one line. */
  #keys dt { color: var(--brass); overflow-wrap: break-word; }
  #keys dd {
    margin: 0 0 5px;
    padding-inline-start: 9px;
    color: var(--dim);
    overflow-wrap: break-word;
  }
  #keys dd:last-child { margin-bottom: 0; }
  #panel-keys .panel-body { max-height: 46vh; overflow: hidden auto; scrollbar-width: thin; }

  /* ------------------------------------------------------- the stage */

  #stage {
    min-width: 0;
    min-height: 0;
    display: grid;
    place-items: center;
    position: relative;
  }
  canvas {
    display: block;
    /* `Display.applyAspect` sets the two lengths in pixels off the box
       the stage gives it, and follows a resize with a ResizeObserver.
       These are what it looks like before the first measurement. */
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: var(--ar);
    image-rendering: pixelated;
    background: #000;
    border: 1px solid var(--rule);
    border-radius: 2px;
  }
  #status {
    grid-area: status;
    align-self: end;
    text-align: center;
    color: var(--dim);
    font-size: 11px;
    min-height: 1.3em;
    padding-top: 3px;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }

  /* ------------------------------------------------------- the panels */

  details.panel {
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: linear-gradient(180deg, var(--vault), var(--ink));
  }
  details.panel > summary {
    cursor: pointer;
    padding: 7px 10px;
    font-family: var(--display);
    font-size: 15px;
    color: var(--brass);
    list-style: none;
    user-select: none;
  }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary::after {
    content: '▾';
    float: inline-end;
    opacity: 0.6;
    font-size: 11px;
  }
  details.panel[open] > summary::after { content: '▴'; }
  .panel-body {
    padding: 0 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .field { display: flex; flex-direction: column; gap: 3px; }
  .field > span { color: var(--dim); font-size: 11px; }
  select, button {
    font: inherit;
    font-family: var(--mono);
    font-size: 12px;
    background: var(--vault);
    color: var(--sand);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 4px 8px;
    text-align: start;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--brass); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.on { background: var(--ember); color: #fff; border-color: var(--ember); }
  select:focus-visible, button:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }
  /* What is in the slot on its own line, the two buttons under it
     sharing the width. A row of label-and-two-buttons fits in English
     and does not in Hebrew -- measured at 1280 by 860, the label came
     out fifty-one pixels wide and said `משבצת ...`. */
  .slot-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .slot-row > span {
    flex: 1 1 100%;
    font-size: 11px;
    color: var(--dim);
    /* It wraps rather than ellipsizes. `Slot 1 - empty` wants 92
       pixels and gets 74 in a margin that has a scrollbar at 420 by
       760, and an ellipsis there says `Slot 1 - em...`, which is the
       one thing the label is for. The row grows a line instead; the
       margin is already a scroller of its own. */
    overflow-wrap: break-word;
  }
  .slot-row > button {
    /* `max-content` rather than nought, so that two buttons that
       cannot share a line **wrap** onto two lines instead of each
       losing its last letters. A margin with a scrollbar is eleven
       pixels narrower, and `potion.html` -- which has one panel more
       than `index.html` -- has one at 420 by 760: enough to put
       `שמירה` at 39 pixels into a 33-pixel button. */
    flex: 1 1 auto;
    min-width: max-content;
    padding: 3px 4px;
    font-size: 11px;
    white-space: nowrap;
    text-align: center;
    /* A button whose word is wider than its share is clipped by the
       panel, not shrunk: measured at 1024 by 700, `Save game` wanted
       65 pixels in a 52-pixel button and lost its last three letters.
       The word on the button is short in both languages now and the
       whole phrase is on its `title`; this is the belt for the braces. */
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .slot-row + .slot-row { margin-top: 7px; }
  #tool-note { font-size: 11px; color: var(--brass); min-height: 1.2em; }

  /* ------------------------------------------- the opening settings page */

  #opening {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: radial-gradient(120% 90% at 50% 0%, #1b1726, var(--ink) 70%);
    display: grid;
    place-items: center;
    padding: 20px;
    overflow: auto;
  }
  #opening[hidden] { display: none; }
  .opening-card {
    width: min(100%, 420px);
    display: flex;
    flex-direction: column;
    gap: 16px;
    text-align: center;
  }
  .opening-card h1 {
    font-family: var(--display);
    font-size: clamp(28px, 6vw, 44px);
    margin: 0;
    color: var(--brass);
  }
  .opening-card > p {
    margin: 0;
    font-family: var(--display);
    font-size: 14px;
    color: var(--dim);
    line-height: 1.55;
  }
  #opening-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    text-align: start;
  }
  #begin {
    font-family: var(--display);
    font-size: 19px;
    padding: 10px;
    text-align: center;
    background: var(--brass);
    color: var(--ink);
    border-color: var(--brass);
    font-weight: 700;
  }

  /* ----------------------------------------------------- the touch pad */

  #pad { display: none; }
  @media (pointer: coarse) {
    #pad {
      display: grid;
      position: absolute;
      inset-inline: 0;
      bottom: 6px;
      grid-template-columns: repeat(3, 54px);
      gap: 6px;
      justify-content: center;
      opacity: 0.78;
    }
    #pad button {
      height: 46px;
      text-align: center;
      touch-action: none;
      user-select: none;
    }
    #pad button[data-down="1"] { background: var(--brass); color: var(--ink); }
  }

  /* A window too narrow for three columns stacks them: the title on one
     line, the game with every pixel of height that is left, and the
     panels under it. */
  @media (max-width: 820px) {
    body {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      grid-template-areas: "title" "stage" "status" "panels";
      gap: 6px;
    }
    #margin-title { flex-direction: row; align-items: baseline; gap: 10px; }
    /* Clause 2: "drop all the current prose". What is left in this
     margin is the name of the game. */
  #margin-title h1 { font-size: 17px; }
    #margin-title p, #keys { display: none; }
    #margin-panels {
      flex-direction: row;
      align-items: flex-start;
      gap: 6px;
      max-height: 40vh;
    }
    #margin-panels > details { flex: 1 1 0; min-width: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

</head>
<body>
<aside class="margin" id="margin-title">
  <h1 id="page-title">Prince of Persia</h1>
</aside>

<main id="stage">
  <canvas id="screen" width="320" height="200" aria-label="The game screen"></canvas>
  <div class="pad" id="pad">
    <button data-key="left up" aria-label="Jump up and to the left">◤</button>
    <button data-key="up" aria-label="Up">▲</button>
    <button data-key="right up" aria-label="Jump up and to the right">◥</button>
    <button data-key="shift" aria-label="Step carefully">⇧</button>
    <button data-key="left" aria-label="Left">◀</button>
    <button data-key="down" aria-label="Down">▼</button>
    <button data-key="right" aria-label="Right">▶</button>
  </div>
</main>

<div id="status">loading the game’s data files…</div>

<aside class="margin" id="margin-panels">
  <details class="panel" id="panel-settings" open>
    <summary id="settings-label">Settings</summary>
    <div class="panel-body" id="settings-fields"></div>
  </details>
  <details class="panel" id="panel-tools" open>
    <summary id="tools-label">Tools</summary>
    <div class="panel-body" id="tools-body">
      <button id="record">Record keys</button>
      <div id="save-slots"></div>
      <div id="tool-note"></div>
    </div>
  </details>
  <details class="panel" id="panel-keys">
    <summary id="keys-label">Keys</summary>
    <div class="panel-body">
      <dl id="keys"></dl>
    </div>
  </details>
  <!--EXTRA-PANEL-->
</aside>

<div id="opening">
  <div class="opening-card">
    <h1 id="opening-title">Prince of Persia</h1>
    <p id="opening-subtitle"></p>
    <div id="opening-fields"></div>
    <button id="begin">Begin</button>
  </div>
</div>


<script type="module" src="./main.js"></script>
<script type="module">
  const pad = document.getElementById('pad');
  const press = (button, down) => {
    button.dataset.down = down ? '1' : '0';
    // A corner of the keypad is two directions at once, as it is on a real one.
    for (const key of button.dataset.key.split(' ')) window.__princeHold?.(key, down);
  };
  for (const button of pad.querySelectorAll('button')) {
    const down = (e) => { e.preventDefault(); press(button, true); };
    const up = (e) => { e.preventDefault(); press(button, false); };
    button.addEventListener('pointerdown', down);
    button.addEventListener('pointerup', up);
    button.addEventListener('pointercancel', up);
    button.addEventListener('pointerleave', up);
  }

  // Keep the level across a republish, so a fix does not cost the player
  // the hour he has played.
  const hot = window.claude?.hot;
  const start = (saved) => {
    if (!saved?.level) return;
    const restore = () => {
      if (!window.__princeReady) return void setTimeout(restore, 120);
      window.__princeGoToLevel?.(saved.level);
    };
    restore();
  };
  hot?.snapshot?.(() => ({ level: window.__princeLevel?.() ?? 0 }));
  if (hot?.ready) hot.ready(start); else start(hot?.data ?? {});
</script>

</body>
</html>
